name: Validate skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skills.py
      - run: python -m unittest discover -s tests -v
      - name: Select PostgreSQL binaries
        run: |
          pg_bindir="$(pg_config --bindir)"
          test -x "$pg_bindir/postgres"
          echo "$pg_bindir" >> "$GITHUB_PATH"
      - name: Test quota against a disposable PostgreSQL cluster
        env:
          RUN_POSTGRES_TESTS: "1"
        run: python -m unittest discover -s tests -p test_quota_postgres.py -v
  dart-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.2"
      - run: python3 scripts/check_dart_snippets.py
